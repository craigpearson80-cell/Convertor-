<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #f6f7f8; --panel: #ffffff; --fg: #1d2329; --muted: #5d6873;
    --line: #dde1e5; --accent: #1f6feb; --danger: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14181c; --panel: #1c2228; --fg: #e6e9ec; --muted: #9aa5b0;
            --line: #2e363e; --accent: #4c8dff; --danger: #ef5350; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--fg); display: flex; }
  #sidebar { width: 320px; display: flex; flex-direction: column; background: var(--panel);
             border-right: 1px solid var(--line); min-width: 0; }
  #sidebar header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line);
                    display: flex; flex-direction: column; gap: 8px; }
  h1 { font-size: 17px; margin: 0; display: flex; justify-content: space-between; align-items: center; }
  #count { font-size: 12px; font-weight: 400; color: var(--muted); }
  input, select, textarea, button { font: inherit; color: inherit; }
  input, select, textarea { width: 100%; padding: 6px 8px; border: 1px solid var(--line);
                            border-radius: 6px; background: var(--bg); }
  button { padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
           background: var(--panel); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .row > * { flex: 1; }
  #list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  #list li { padding: 9px 16px; border-bottom: 1px solid var(--line); cursor: pointer;
             display: flex; gap: 10px; align-items: flex-start; }
  #list li:hover { background: var(--bg); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; margin-top: 4px; }
  .li-name { font-weight: 600; }
  .li-meta { color: var(--muted); font-size: 12px; }
  #editbar { padding: 10px 16px; border-top: 1px solid var(--line); display: flex;
             flex-direction: column; gap: 6px; }
  #editbar .hint { color: var(--muted); font-size: 12px; }
  #map { flex: 1; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
           background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 6px;
           opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 2000; }
  #toast.show { opacity: 1; }
  body.editing #map { cursor: crosshair; }
  /* Popups */
  .leaflet-popup-content { margin: 12px 14px; min-width: 220px; }
  .pop h3 { margin: 0 0 2px; font-size: 15px; }
  .pop .meta { color: #5d6873; font-size: 12px; margin-bottom: 6px; }
  .pop ul { margin: 6px 0 0; padding-left: 18px; }
  .pop .actions { margin-top: 10px; display: flex; gap: 6px; }
  .pop form { display: flex; flex-direction: column; gap: 6px; }
  .pop label { font-size: 12px; color: #5d6873; display: flex; flex-direction: column; gap: 2px; }
  .pop input, .pop textarea { background: #fff; color: #1d2329; border-color: #ccd; }
  .pop button { background: #fff; color: #1d2329; border-color: #ccd; }
  .pop button.primary { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  .pop button.danger { color: #c62828; }
  @media (max-width: 700px) {
    body { flex-direction: column-reverse; }
    #sidebar { width: 100%; height: 45%; border-right: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<aside id="sidebar">
  <header>
    <h1>Asset Map <span id="count"></span></h1>
    <input id="search" type="search" placeholder="Search name, notes, status…" aria-label="Search assets">
    <select id="category" aria-label="Filter by category"><option value="">All categories</option></select>
  </header>
  <ul id="list"></ul>
  <div id="editbar">
    <button id="editToggle">Edit assets</button>
    <div id="editTools" hidden>
      <div class="hint">Click the map to add an asset. Drag a marker to move it. Changes are kept in this browser until you export.</div>
      <div class="row" style="margin-top:6px">
        <button id="exportBtn" class="primary">Export CSV</button>
        <button id="importBtn">Import CSV</button>
        <button id="resetBtn" class="danger">Discard changes</button>
      </div>
      <input id="importFile" type="file" accept=".csv,text/csv" hidden>
    </div>
  </div>
</aside>
<div id="map"></div>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="app.js"></script>
</body>
</html>
